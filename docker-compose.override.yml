# 本机开发专用的端口，compose 只在「本目录里有这个文件」时自动加载它。
# 服务器上只放 docker-compose.yml（不带这个文件），所以那边只有前端一个端口对外。
# 这里三个端口都绑在 127.0.0.1 —— 只有本机能连，局域网照样进不来。
services:

  correction:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-32546}:32546"

  minio:
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"          # S3 接口（浏览器直连模式要用它，配合 S3_PUBLIC_ENDPOINT）
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"  # 控制台（看桶里有哪些文件）