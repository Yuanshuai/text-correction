# 纠错前端：静态托管 + /api 反代到纠错服务。
# 由 nginx 官方镜像的 envsubst 机制生成：容器启动时把 ${CORRECTION_UPSTREAM} 换成实际地址。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 后端地址用变量 + Docker 内置 DNS：nginx 会按 TTL 重新解析，
    # 所以后端容器被重建（IP 变了）之后前端不会一直 502，不用手动重启前端。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $correction ${CORRECTION_UPSTREAM};

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带指纹的构建产物可以长缓存；index.html 不缓存，重新发布后立刻生效
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx 自带的 mime.types 里没有 .mjs，而 PDF 阅读器的 worker 就是 .mjs：
    # 不补这一条它会被当成 octet-stream，浏览器按模块脚本的严格 MIME 校验直接拒掉，
    # 结果页就只剩一句「Setting up fake worker failed」。正则 location 优先于上面的
    # /assets/，所以缓存头这里再写一遍。
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/* -> 纠错服务，去掉 /api 前缀
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $correction;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一份大文档的纠错是按分钟算的：光等外部解析就可能要 PARSE2JSON_MAX_WAIT_MIN 分钟，
        # 再加模型来回好几轮。nginx 默认 60s 会把请求掐断成 504，所以默认给到 2 小时
        # （PROXY_TIMEOUT 可调；调小了要保证仍大于「等解析 + 纠错」的总时长）。
        proxy_read_timeout ${PROXY_TIMEOUT};
        proxy_send_timeout ${PROXY_TIMEOUT};
        client_max_body_size 100m;
    }

    # 对外接口：/openapi/* 原样转给纠错服务（不剥前缀），外部系统直接调这个路径。
    # 只开前端这一个端口时，外部就是靠这条进来。
    location /openapi/ {
        proxy_pass $correction;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout ${PROXY_TIMEOUT};
        proxy_send_timeout ${PROXY_TIMEOUT};
        client_max_body_size 100m;
    }

    # 结果页是前端自己的 hash 路由（/#/result/<id>），静态托管即可，
    # 用 SPA 回退保证深链接、刷新都能打开。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
